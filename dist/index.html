<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>Gráficos</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000d2e'/%3E%3Cpath d='M7 6v20M7 10h-2M7 20h2M16 9v16M16 13h-2M16 21h2M25 4v18M25 8h-2M25 16h2' stroke='%23ffffff' stroke-width='2.5'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="/assets/index-CflHk4Sl.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BtkdeclM.css">
  </head>
  <body>
    <header id="topbar">
      <div class="symbox" title="Símbolo actual (elígelo en la lista de la derecha)"><span id="cur-symbol">—</span></div>
      <div id="tf-buttons" class="tf-buttons"></div>
      <span class="sep"></span>
      <button id="btn-grid" class="tb" title="Cuadrícula de 6 gráficos">▦ 6 gráficos</button>
      <button id="btn-single" class="tb" title="Un solo gráfico grande">▢ Uno grande</button>
      <span class="sep"></span>
      <div id="line-editor" class="line-editor" style="display: none">
        <span class="le-swatches"></span>
        <input class="le-color" type="color" title="Otro color" />
        <select class="le-width" title="Grosor">
          <option value="1">1px</option>
          <option value="2">2px</option>
          <option value="3">3px</option>
          <option value="4">4px</option>
        </select>
        <select class="le-style" title="Estilo">
          <option value="0">Sólida</option>
          <option value="2">Discontinua</option>
          <option value="1">Punteada</option>
        </select>
        <input class="le-price" type="text" inputmode="decimal" title="Precio" />
        <button class="le-del tb danger" title="Borrar (tecla Supr)">🗑</button>
        <button class="le-close icon-btn" title="Deseleccionar (Esc)">✕</button>
      </div>
      <div class="spacer"></div>
      <span id="server-warn" class="warn" style="display: none" title="Los dibujos y ajustes no se están guardando">⚠ Sin conexión con el servidor</span>
      <span class="dim small" id="provider-name"></span>
      <span id="conn" class="conn connecting" title="Conectando…"></span>
      <button id="btn-sidebar" class="icon-btn" title="Mostrar/ocultar la lista de seguimiento">☰</button>
    </header>
    <main id="main">
      <nav id="toolbar">
        <button id="btn-cursor" class="tool on" title="Cursor (Esc)">
          <svg viewBox="0 0 28 28" width="24" height="24"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M14 4v20M4 14h20"/></svg>
        </button>
        <button id="btn-hline" class="tool" title="Línea horizontal (Alt+H)">
          <svg viewBox="0 0 28 28" width="24" height="24"><path stroke="currentColor" stroke-width="1.4" d="M3 14h22"/><circle cx="14" cy="14" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button class="tool soon" disabled title="Línea de tendencia (fase 3)">
          <svg viewBox="0 0 28 28" width="24" height="24"><path stroke="currentColor" stroke-width="1.4" d="M5 23L23 5"/></svg>
        </button>
        <button class="tool soon" disabled title="Retroceso de Fibonacci (fase 3)">
          <svg viewBox="0 0 28 28" width="24" height="24"><path stroke="currentColor" stroke-width="1.4" d="M3 6h22M3 11h22M3 16h22M3 22h22"/></svg>
        </button>
        <button class="tool soon" disabled title="Posición larga/corta (fase 3)">
          <svg viewBox="0 0 28 28" width="24" height="24"><rect x="5" y="5" width="18" height="8" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="5" y="13" width="18" height="10" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </nav>
      <section id="charts"></section>
      <aside id="watchlist"></aside>
    </main>
    <footer id="footer">
      Gráficos con
      <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView Lightweight Charts™</a>
      (Apache 2.0) · Datos de mercado:
      <a href="https://www.binance.com/" target="_blank" rel="noopener">Binance</a> · Uso privado familiar
    </footer>
  </body>
</html>
